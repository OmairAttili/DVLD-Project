<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DVLD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="./src/output.css" rel="stylesheet">
</head>
<body>
    <header class="bg-[#3f6ca6] w-full py-3">
        <div class="container">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <img alt="Logo" src="./src/img/D-Logo.png"/>
                    <h1 class="text-white text-2xl font-bold underline decoration-[#a3a3ad46] decoration-1 underline-offset-4">DVLD</h1>
                    <div class="text-white text-xs border-l pl-2 border-[#a3a3ad46]">
                        <h2>Vehicle & Licnese</h2>
                        <h2>Management system</h2>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <form class="bg-white px-2 py-1 rounded-sm flex items-center gap-2">
                        <i class="fa-solid fa-magnifying-glass text-gray-400 text-sm"></i>
                        <input type="text" placeholder="Search..." class="outline-0 border-0 text-[#6A737C] text-[13px]"/>
                    </form>
                    <button type="button" class="relative cursor-pointer hover:scale-105 transition-all duration-200">
                        <i class="fa-solid fa-bell fa-xl text-white"></i>
                        <div class="rounded-full bg-red-500 text-white flex items-center justify-center size-4 text-xs absolute -top-2 -right-3"><span>1</span></div>
                    </button>
                    <button class="bg-[#13335e] py-1 flex items-center px-2 rounded-md">
                      <img src="./src/img/EleanorPena.png" alt="Elanor pena" class="size-7"/>
                      <select class="text-white bg-[#13335e] border-0">
                        <option>Admin</option>
                      </select>
                    </button>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
